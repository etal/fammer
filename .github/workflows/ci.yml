name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; every other run
# has a group of its own, so each push to master keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# setup-uv and setup-pixi are pinned to exact releases: setup-uv has no
# major-version tag after v7, and the v0 tag of setup-pixi moves across
# breaking changes.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --only-group dev ruff check
      - run: uv run --locked --only-group dev ruff format --check

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --all-extras pytest -m "not integration"

  # The pixi task sets FAMMER_REQUIRE_TOOLS, so a missing program fails rather
  # than skips.
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          # The pixi release that wrote pixi.lock; Dependabot does not update it.
          pixi-version: v0.83.0
      - run: pixi run test-integration
