[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fammer"
dynamic = ["version"]
description = "Tools for protein superfamily sequence profile alignment and curation."
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Eric Talevich", email = "me+code@etal.mozmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# biopython, networkx and numpy floors follow the versions Ubuntu 26.04 ships.
# The biofrills and biocma floors are development versions, because biofrills
# 0.4.0 and biocma 0.3.0 are not yet released and PEP 440 orders 0.4.0.dev0
# below 0.4. A development floor also admits later pre-releases, so raise both
# floors to the release versions once those exist.
dependencies = [
    "biofrills>=0.4.0.dev0",
    "biopython>=1.86",
    "networkx>=3.2.1",
    "numpy>=2.3.5",
]

[project.optional-dependencies]
mapgaps = ["biocma>=0.3.0.dev0"]

[project.scripts]
fammer = "fammer.cli:main"
fammer-tmalign = "fammer.cli:tmalign_main"

[project.urls]
homepage = "https://github.com/etal/fammer"

# scikit-learn is the independent implementation of the silhouette that the
# tests compare fammer's with; its floor follows Ubuntu 26.04.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.17.2",
    "scikit-learn>=1.7.2",
]

# Named explicitly: automatic discovery in this flat layout also finds the
# example data under profiles/ and refuses to build.
[tool.setuptools]
packages = ["fammer"]

[tool.setuptools.dynamic]
version = {attr = "fammer.__version__"}

[tool.pytest.ini_options]
minversion = "9.0.2"
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["error"]
markers = [
    "integration: runs the external programs that fammer drives",
]

[tool.ruff]
# tests/data/capture_py27.py is the frozen Python 2.7 script that captured
# the reference outputs; the pyupgrade rules would rewrite it into code that
# Python 2 cannot run. .pixi holds the pixi environments and is otherwise
# excluded only through .gitignore.
extend-exclude = [".pixi", "tests/data/capture_py27.py"]

[tool.ruff.lint]
# C403 and C405 flag set([...]); the rest of the flake8-comprehensions
# family is not selected.
select = ["E", "F", "W", "I", "UP", "B", "LOG", "G", "C403", "C405"]

# biofrills and biocma come from their repositories at pinned commits, which
# the lock files then record; moving to a newer commit is a deliberate change
# of the pin. pixi reads this table too, so it serves both workflows, and both
# need a git executable to install. Delete it when the releases named in the
# comment on [project] dependencies exist.
[tool.uv.sources]
biofrills = {git = "https://github.com/etal/biofrills.git", rev = "522d735fd2ff18d0b470515cca3b90cb800e35a0"}
biocma = {git = "https://github.com/etal/biocma.git", rev = "307d607b1739f647610918113176bc7dcd71dbbc"}

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

# Version constraints live in [project] and [dependency-groups]; pixi derives
# its dev feature from the dependency group, and a conda package below one of
# those constraints fails the lock. The Python packages are named here only so
# that conda-forge supplies them rather than PyPI. The programs are what fammer
# runs and the reason for this workspace: mafft from conda-forge, the only
# channel with an osx-arm64 build, and the others from bioconda.
[tool.pixi.dependencies]
biopython = "*"
networkx = "*"
numpy = "*"
mafft = "*"
hmmer = "*"
tmalign = "*"
mustang = "*"
fasttree = "*"

[tool.pixi.pypi-dependencies]
fammer = {path = ".", editable = true, extras = ["mapgaps"]}

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
scikit-learn = "*"

# The oldest supported Python; keep in step with requires-python.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = {features = ["dev"]}
py312 = {features = ["dev", "py312"]}

[tool.pixi.tasks]
test = "pytest -m 'not integration'"
test-integration = {cmd = "pytest -m integration", env = {FAMMER_REQUIRE_TOOLS = "1"}}
lint = "ruff check"
fmt = "ruff format"
